name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.0"

      - name: Build app
        run: ./scripts/buildprod.sh
  
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Use gcloud CLI
        run: gcloud info

      - name: Build and Push docker image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          gcloud builds submit --tag us-central1-docker.pkg.dev/notely-463306/notely-ar-repo/notely:$SHORT_SHA .

      - name: deploy app to cloud run
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-463306/notely-ar-repo/notely:$SHORT_SHA --region us-central1 --allow-unauthenticated --project notely-463306 --max-instances=4